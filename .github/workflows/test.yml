# .github/workflows/test.yml
name: Tests

on: [push, pull_request]

# Ce workflow se declenche sur `pull_request`, donc potentiellement depuis un
# fork : le job execute `npm ci` (scripts d'installation tiers) et les tests du
# contributeur. Il ne doit disposer que de la lecture.
permissions:
  contents: read

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      # Epinglees par SHA : cf. release-front.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Aligne sur release-front.yml : @electron/rebuild (via
          # electron-builder 26) exige `node >=22.12.0`.
          node-version: '22'

      # npm 11 obligatoire (Node 22 embarque npm 10). `vite@8`, tiree par
      # `vitest@4`, declare `esbuild` en peer OPTIONNEL : npm 10 l'installe a
      # tort, npm 11 non. Les lockfiles des deux versions sont mutuellement
      # incompatibles et celui du depot est genere avec npm 11.
      - run: npm i -g npm@11

      - run: npm ci

      # Lint et typecheck AVANT les tests : CLAUDE.md documente le lint comme
      # bloquant (--max-warnings 0) et la release lance `tsc`, mais aucun des
      # deux ne tournait sur PR. Une PR pouvait donc etre verte et casser la
      # release. Ils passent en premier parce qu'ils echouent vite.
      - run: npm run lint
      - run: npx tsc --noEmit

      - run: npm test -- --coverage
