# .github/workflows/release-front.yml
name: Release Frontend

on:
  push:
    tags:
      - "v*"

# Aucune permission par defaut : chaque job declare le strict minimum.
# Auparavant `contents: write` etait declare au niveau du workflow, si bien que
# le job `test` — qui execute `npm ci`, donc du code de dependances tierces —
# heritait d'un token capable de publier des releases.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions epinglees par SHA : un tag comme @v4 est mutable et peut etre
      # repointe par le mainteneur (ou par un compte compromis) vers du code
      # arbitraire, execute ici avec acces aux secrets de publication.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 22 : electron-builder 26 embarque @electron/rebuild qui exige
          # `node >=22.12.0`. Sur Node 20, `npm ci` remontait des EBADENGINE et
          # le build natif n'etait pas garanti.
          node-version: "22"

      # npm 11 OBLIGATOIRE (Node 22 embarque npm 10).
      #
      # `vite@8` — tiree comme dependance imbriquee par `vitest@4` — declare
      # `esbuild` en peer OPTIONNEL (peerDependenciesMeta.esbuild.optional).
      # npm 11 respecte ce marquage et n'installe pas esbuild ; npm 10 l'installe
      # quand meme. Les deux produisent donc des lockfiles differents et
      # MUTUELLEMENT INCOMPATIBLES : avec un lock npm 11, npm 10 echoue en
      # `Missing: esbuild@0.28.1 from lock file` ; avec un lock npm 10, npm 11
      # echoue en `Missing: lightningcss-*`.
      # Le lock du depot est genere avec npm 11 : la CI doit utiliser la meme
      # version majeure, sinon `npm ci` echoue quoi qu'il arrive.
      - run: npm i -g npm@11

      - run: npm ci
      - run: npm test

  build-and-release:
    needs: test
    runs-on: windows-latest
    # Seul ce job publie la release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Doit rester aligne sur le job `test` ci-dessus (>=22.12 requis par
          # @electron/rebuild, tire par electron-builder 26).
          node-version: "22"

      # Meme contrainte que dans le job `test` : le lock est genere avec npm 11,
      # npm 10 le rejette. Voir le commentaire detaille plus haut.
      - run: npm i -g npm@11

      - run: npm ci

      # Extract version from git tag (v7.2.0 -> 7.2.0) and inject into package.json.
      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Select the right electron-builder config based on the tag:
      #   v7.3.0           -> stable  -> electron-builder.json5       + VITE production
      #   v7.3.1-beta.0    -> beta    -> electron-builder.beta.json5  + VITE staging
      #
      # Les DEUX configs vivent dans le repo (plus d'inline-rewriting), ce qui
      # evite les drifts entre le config reellement publie et ce que l'app embarque.
      - name: Detect channel and select config
        shell: bash
        run: |
          if [[ "$VERSION" == *-beta.* ]]; then
            echo "BUILDER_CONFIG=electron-builder.beta.json5" >> "$GITHUB_ENV"
            echo "VITE_MODE=staging" >> "$GITHUB_ENV"
            # CHANNEL etait seulement affiche, jamais ecrit dans $GITHUB_ENV :
            # la variable n'existait donc pas dans les etapes suivantes.
            echo "CHANNEL=beta" >> "$GITHUB_ENV"
          else
            echo "BUILDER_CONFIG=electron-builder.json5" >> "$GITHUB_ENV"
            echo "VITE_MODE=production" >> "$GITHUB_ENV"
            echo "CHANNEL=stable" >> "$GITHUB_ENV"
          fi

      # .env.production / .env.staging are .gitignored. We rebuild the right
      # one at build time from GitHub Secrets so the Vite bundle embeds the
      # correct values per channel.
      - name: Write env file from secrets
        shell: bash
        env:
          ROOMS_URL_PROD: ${{ secrets.VITE_ROOMS_SERVER_URL_PROD }}
          ROOMS_URL_STAGING: ${{ secrets.VITE_ROOMS_SERVER_URL_STAGING }}
          APTABASE_KEY_PROD: ${{ secrets.VITE_APTABASE_APP_KEY_PROD }}
          APTABASE_KEY_STAGING: ${{ secrets.VITE_APTABASE_APP_KEY_STAGING }}
          APTABASE_HOST: ${{ secrets.VITE_APTABASE_HOST }}
        run: |
          if [[ "$VITE_MODE" == "staging" ]]; then
            ENV_FILE=".env.staging"
            ROOMS_URL="$ROOMS_URL_STAGING"
            APTABASE_KEY="$APTABASE_KEY_STAGING"
          else
            ENV_FILE=".env.production"
            ROOMS_URL="$ROOMS_URL_PROD"
            APTABASE_KEY="$APTABASE_KEY_PROD"
          fi
          {
            echo "VITE_ROOMS_SERVER_URL=$ROOMS_URL"
            echo "VITE_APTABASE_APP_KEY=$APTABASE_KEY"
            echo "VITE_APTABASE_HOST=$APTABASE_HOST"
          } > "$ENV_FILE"
          echo "Wrote $ENV_FILE (values hidden)"

          # Un secret vide ou renomme ne fait echouer aucune etape : le build
          # reste vert et on publie une version ou les rooms premade ne peuvent
          # PAS se connecter (cspPlugin omet silencieusement l'entree
          # connect-src quand l'URL est vide). On echoue ici plutot que chez
          # l'utilisateur.
          if [[ -z "$ROOMS_URL" ]]; then
            echo "::error::VITE_ROOMS_SERVER_URL est vide pour le canal $VITE_MODE — secret absent ou renomme."
            exit 1
          fi
          echo "ROOMS_ORIGIN=$(printf '%s' "$ROOMS_URL" | sed -E 's#^(https?://[^/]+).*#\1#')" >> "$GITHUB_ENV"

      - name: Build renderer and main
        run: npx tsc && npx vite build --mode ${{ env.VITE_MODE }}

      # Verifie que la CSP reellement produite autorise le serveur de rooms.
      # C'est la seule preuve que le secret a bien traverse tout le build :
      # la valeur est inlinee dans index.html au moment du build, pas au runtime.
      - name: Verify rooms server allowed by CSP
        shell: bash
        run: |
          if ! grep -q "$ROOMS_ORIGIN" dist/index.html; then
            echo "::error::L'origine du serveur de rooms ($ROOMS_ORIGIN) est absente de la CSP de dist/index.html."
            exit 1
          fi
          echo "CSP verifiee : $ROOMS_ORIGIN autorise."

      # La GitHub Release est creee ICI, avant electron-builder.
      #
      # electron-builder 26 lance un publisher PAR ARTEFACT (installeur,
      # blockmap, manifeste). Chacun verifie si la release existe puis la cree
      # si non : deux POST /releases concurrents, le second recoit
      # `422 already_exists` et fait echouer le job. Sur la v9.5.3 l'installeur
      # avait deja ete uploade, mais pas `latest.yml` — la release etait donc
      # publique, incomplete, et invisible pour l'autoUpdater.
      #
      # En la creant en amont, les publishers la trouvent existante et se
      # contentent d'uploader : plus de course.
      #
      # La release est creee en DRAFT, puis publiee explicitement une fois tous
      # les assets uploades (etape « Publish the release » plus bas).
      #
      # Deux raisons :
      #  1. electron-builder 26 ramene la release en draft pendant l'upload et ne
      #     la republie pas de maniere fiable, malgre `releaseType: "release"`
      #     dans la config. Sur la v9.5.3, tous les assets etaient presents mais
      #     la release restait en draft — donc invisible pour l'autoUpdater ET
      #     pour l'API publique.
      #  2. Un echec en cours de route laisse alors une release INVISIBLE plutot
      #     qu'une release publique et incomplete. C'est le bon mode de defaut.
      - name: Ensure GitHub release exists (draft)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG deja presente — rien a creer."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --generate-notes --draft
          fi

      - name: Publish release
        run: npx electron-builder --config ${{ env.BUILDER_CONFIG }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Bascule draft -> publie. C'est CETTE etape qui rend la version visible
      # par les clients deja installes ; sans elle, electron-updater ne voit
      # rien (les drafts ne sont pas exposes, meme pas sur l'API publique).
      - name: Publish the release (draft -> public)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$VERSION"
          if [[ "$CHANNEL" == "beta" ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=true
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false
          fi

      # Garde-fou final. Une release n'est utilisable par les clients installes
      # que si TROIS conditions sont reunies simultanement :
      #   - le manifeste (latest.yml / beta.yml) est present,
      #   - un installeur .exe est present,
      #   - la release n'est PAS en draft, et son flag prerelease correspond au
      #     canal.
      #
      # Les deux echecs de la v9.5.3 ont chacun viole une de ces conditions sans
      # etre detecte : d'abord le manifeste manquant (job rouge, mais release
      # publique et incomplete), puis l'etat draft (job VERT, release invisible).
      # La verification de l'etat draft est ce qui manquait.
      - name: Verify release is usable by installed clients
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$VERSION"
          if [[ "$CHANNEL" == "beta" ]]; then
            MANIFEST="beta.yml"; WANT_PRE="true"
          else
            MANIFEST="latest.yml"; WANT_PRE="false"
          fi

          INFO=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets)
          IS_DRAFT=$(printf '%s' "$INFO" | jq -r '.isDraft')
          IS_PRE=$(printf '%s' "$INFO" | jq -r '.isPrerelease')
          ASSETS=$(printf '%s' "$INFO" | jq -r '.assets[].name')

          echo "Canal        : $CHANNEL"
          echo "isDraft      : $IS_DRAFT (attendu false)"
          echo "isPrerelease : $IS_PRE (attendu $WANT_PRE)"
          echo "Assets :"
          echo "$ASSETS" | sed 's/^/  - /'

          FAIL=0
          if [[ "$IS_DRAFT" != "false" ]]; then
            echo "::error::Release $TAG encore en draft — invisible pour electron-updater."
            FAIL=1
          fi
          if [[ "$IS_PRE" != "$WANT_PRE" ]]; then
            echo "::error::Flag prerelease=$IS_PRE incoherent avec le canal $CHANNEL (attendu $WANT_PRE)."
            FAIL=1
          fi
          if ! echo "$ASSETS" | grep -qx "$MANIFEST"; then
            echo "::error::$MANIFEST absent — l'autoUpdater ne verra pas cette version."
            FAIL=1
          fi
          if ! echo "$ASSETS" | grep -q '\.exe$'; then
            echo "::error::Aucun installeur .exe dans la release $TAG."
            FAIL=1
          fi
          [[ "$FAIL" -eq 0 ]] || exit 1
          echo "Release $TAG publiee et utilisable."
