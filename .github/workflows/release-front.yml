# .github/workflows/release-front.yml
name: Release Frontend

on:
  push:
    tags:
      - "v*"

# Aucune permission par defaut : chaque job declare le strict minimum.
# Auparavant `contents: write` etait declare au niveau du workflow, si bien que
# le job `test` — qui execute `npm ci`, donc du code de dependances tierces —
# heritait d'un token capable de publier des releases.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions epinglees par SHA : un tag comme @v4 est mutable et peut etre
      # repointe par le mainteneur (ou par un compte compromis) vers du code
      # arbitraire, execute ici avec acces aux secrets de publication.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Node 22 : electron-builder 26 embarque @electron/rebuild qui exige
          # `node >=22.12.0`. Sur Node 20, `npm ci` remontait des EBADENGINE et
          # le build natif n'etait pas garanti.
          node-version: "22"

      # npm 11 OBLIGATOIRE (Node 22 embarque npm 10).
      #
      # `vite@8` — tiree comme dependance imbriquee par `vitest@4` — declare
      # `esbuild` en peer OPTIONNEL (peerDependenciesMeta.esbuild.optional).
      # npm 11 respecte ce marquage et n'installe pas esbuild ; npm 10 l'installe
      # quand meme. Les deux produisent donc des lockfiles differents et
      # MUTUELLEMENT INCOMPATIBLES : avec un lock npm 11, npm 10 echoue en
      # `Missing: esbuild@0.28.1 from lock file` ; avec un lock npm 10, npm 11
      # echoue en `Missing: lightningcss-*`.
      # Le lock du depot est genere avec npm 11 : la CI doit utiliser la meme
      # version majeure, sinon `npm ci` echoue quoi qu'il arrive.
      - run: npm i -g npm@11

      - run: npm ci
      - run: npm test

  build-and-release:
    needs: test
    runs-on: windows-latest
    # Seul ce job publie la release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Doit rester aligne sur le job `test` ci-dessus (>=22.12 requis par
          # @electron/rebuild, tire par electron-builder 26).
          node-version: "22"

      # Meme contrainte que dans le job `test` : le lock est genere avec npm 11,
      # npm 10 le rejette. Voir le commentaire detaille plus haut.
      - run: npm i -g npm@11

      - run: npm ci

      # Extract version from git tag (v7.2.0 -> 7.2.0) and inject into package.json.
      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Select the right electron-builder config based on the tag:
      #   v7.3.0           -> stable  -> electron-builder.json5       + VITE production
      #   v7.3.1-beta.0    -> beta    -> electron-builder.beta.json5  + VITE staging
      #
      # Les DEUX configs vivent dans le repo (plus d'inline-rewriting), ce qui
      # evite les drifts entre le config reellement publie et ce que l'app embarque.
      - name: Detect channel and select config
        shell: bash
        run: |
          if [[ "$VERSION" == *-beta.* ]]; then
            echo "BUILDER_CONFIG=electron-builder.beta.json5" >> "$GITHUB_ENV"
            echo "VITE_MODE=staging" >> "$GITHUB_ENV"
            echo "CHANNEL=beta"
          else
            echo "BUILDER_CONFIG=electron-builder.json5" >> "$GITHUB_ENV"
            echo "VITE_MODE=production" >> "$GITHUB_ENV"
            echo "CHANNEL=stable"
          fi

      # .env.production / .env.staging are .gitignored. We rebuild the right
      # one at build time from GitHub Secrets so the Vite bundle embeds the
      # correct values per channel.
      - name: Write env file from secrets
        shell: bash
        env:
          ROOMS_URL_PROD: ${{ secrets.VITE_ROOMS_SERVER_URL_PROD }}
          ROOMS_URL_STAGING: ${{ secrets.VITE_ROOMS_SERVER_URL_STAGING }}
          APTABASE_KEY_PROD: ${{ secrets.VITE_APTABASE_APP_KEY_PROD }}
          APTABASE_KEY_STAGING: ${{ secrets.VITE_APTABASE_APP_KEY_STAGING }}
          APTABASE_HOST: ${{ secrets.VITE_APTABASE_HOST }}
        run: |
          if [[ "$VITE_MODE" == "staging" ]]; then
            ENV_FILE=".env.staging"
            ROOMS_URL="$ROOMS_URL_STAGING"
            APTABASE_KEY="$APTABASE_KEY_STAGING"
          else
            ENV_FILE=".env.production"
            ROOMS_URL="$ROOMS_URL_PROD"
            APTABASE_KEY="$APTABASE_KEY_PROD"
          fi
          {
            echo "VITE_ROOMS_SERVER_URL=$ROOMS_URL"
            echo "VITE_APTABASE_APP_KEY=$APTABASE_KEY"
            echo "VITE_APTABASE_HOST=$APTABASE_HOST"
          } > "$ENV_FILE"
          echo "Wrote $ENV_FILE (values hidden)"

      - name: Build renderer and main
        run: npx tsc && npx vite build --mode ${{ env.VITE_MODE }}

      - name: Publish release
        run: npx electron-builder --config ${{ env.BUILDER_CONFIG }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
